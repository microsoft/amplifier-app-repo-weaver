[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-weaver"
version = "0.1.0"
description = "Turn a git repo's commits + PRs into a queryable knowledge corpus via wiki-weaver."
requires-python = ">=3.11"
# wiki-weaver is a REAL dependency: repo-weaver imports its path constants (the single
# source of truth for corpus layout) AND shells out to its CLI for ingest/ask/dashboard.
# It is not published to PyPI, so it is pinned to @main via a PEP 508 git URL — the same
# model wiki-weaver uses for its own git deps.
# Other EXTERNAL runtime tools (shelled, not imported): git, gh (GitHub CLI).
# Run `repo-weaver doctor` to verify all external tools are present and configured.
dependencies = [
    "wiki-weaver @ git+https://github.com/microsoft/amplifier-app-wiki-weaver@main",
]
readme = "README.md"
license = { text = "MIT" }

[tool.uv]
# Resolution override, not a preference.
#
# wiki-weaver depends on `amplifier-foundation @ main` directly, AND on
# `amplifier-module-pipeline-runner` (vendored in the attractor bundle) which
# pins `amplifier-foundation` to a specific SHA. uv treats two different git
# URLs for one package as an unresolvable conflict, so `uv sync` fails outright
# with "Requirements contain conflicting URLs".
#
# Nothing in this repo caused it -- the pin drifted upstream, and CI has been
# red on `main` since 2026-07-09 for this reason alone. This override pins the
# package to a single URL so resolution succeeds. Remove it once the upstream
# pins agree again.
override-dependencies = [
    "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@main",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
repo-weaver = "repo_weaver.cli:main"

[tool.hatch.build.hooks.custom]
# Bakes a git-derived version (commit date + short SHA) into
# repo_weaver/_version.py at wheel-build time -- see hatch_build.py.
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
# policy/schema.md lives inside repo_weaver/policy/ so it is included in the
# wheel automatically alongside the Python source.  Works for both editable and
# non-editable (uv tool install) installs.
packages = ["repo_weaver"]

[tool.hatch.metadata]
# Required so hatchling will build a wheel whose dependencies use a direct git URL
# (the `wiki-weaver @ git+...` pin above). Same setting wiki-weaver uses for its own git deps.
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    # Not a runtime dep -- needed only so tests/test_hatch_build.py can import
    # the real hatchling.builders.hooks.plugin.interface.BuildHookInterface
    # that hatch_build.py's build hook subclasses.
    "hatchling>=1.28.0",
]
